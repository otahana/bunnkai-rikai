<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分解して理解する/title</title>
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden; 
            background-color: aliceblue;
            position: relative;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        #intro-video {
            position: absolute;
            z-index: 10;
            width: 90vw;
            height: 90vh;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            background-color: rgba(255, 255, 255, 0); 
        }

        #game-screen {
            width: 100%;
            height: 100%;
            position: absolute;
            background-image: url(title01.jpg);
            background-size: 70%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 5;
        }

        .hidden {
            display: none;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            display: block; 
            background-color: transparent;
            transition: background-color 0.3s;
        }

        .decision-area {
            width: 150px; 
            height: 60px; 
            bottom: 85px;
            right: 250px; 
        }

        .summary-area {
            width: 150px; 
            height: 60px; 
            bottom: 85px;
            left: 250px;
        }

        .clickable-area:hover {
            background-color: rgba(235, 235, 235, 0.102);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0), inset 0 0 10px rgb(0, 217, 255);
        }
    </style>
</head>
<body>

    <video id="intro-video" src="title_a.mp4"></video>

    <div id="game-screen" class="hidden">
        <a href="start_select.html" class="clickable-area decision-area"></a>
        <a href="summary.html" class="clickable-area summary-area"></a>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const video = document.getElementById('intro-video');
        const gameScreen = document.getElementById('game-screen');

        // 効果音の読み込み
        const hoverSound = new Audio("bgm/clickT.mp3");

        // ページ読み込み後、すぐに動画を再生
        video.muted = true; 
        video.play().catch(error => {
            console.log("Video auto-play blocked:", error);
        });

        // 動画終了でゲーム画面に切り替え
        video.addEventListener('ended', () => {
            switchToGameScreen();
        });

        // 動画クリックでもスキップ
        video.addEventListener('click', () => {
            video.pause();
            switchToGameScreen();
        });

        // 画面切り替えの共通関数
        function switchToGameScreen() {
            video.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            // ★ゲーム画面が表示された後にホバー音を有効化
            document.querySelectorAll(".clickable-area").forEach(area => {
                area.addEventListener("mouseenter", () => {
                    hoverSound.currentTime = 0;
                    hoverSound.play().catch(e => console.log(e));
                });
            });
        }
    });
    </script>
</body>
</html>
